name: Build Gato EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip install pillow pystray pyinstaller

    - name: Build EXE
      run: pyinstaller --noconsole --onefile gato_taskbar.py

    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: gato-taskbar
        path: dist/gato_taskbar.exe
