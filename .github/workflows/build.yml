name: Build Gato EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip install pillow pystray pyinstaller

    - name: Convert image to icon
      run: |
        python -c "
        from PIL import Image
        import os

        # Definimos la ruta basándonos en tu estructura de carpetas
        input_path = 'image/gato_icon.jpg'
        output_path = 'cat_icon.ico'

        if os.path.exists(input_path):
            img = Image.open(input_path)
            # Convertimos a ICON con los tamaños estándar
            img.save(output_path, format='ICO', sizes=[(256,256),(64,64),(32,32),(16,16)])
            print('Icono generado exitosamente desde la carpeta image/')
        else:
            print(f'Error: No se encontró el archivo en {input_path}')
            exit(1)
        "

    - name: Build EXE
      run: pyinstaller --noconsole --onefile --icon=cat_icon.ico --name=GatoTaskbar gato_taskbar.py

    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: GatoTaskbar
        path: dist/GatoTaskbar.exe
