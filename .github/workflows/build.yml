name: Build Gato EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip install pillow pystray pyinstaller

    - name: Generate icon
      run: |
        python -c "
        from PIL import Image, ImageDraw
        import os

        img = Image.new('RGBA', (256,256), (0,0,0,0))
        d = ImageDraw.Draw(img)
        C = (15,15,15,255)
        G = (80,200,120,255)

        def e(cx,cy,rx,ry,f): d.ellipse([cx-rx,cy-ry,cx+rx,cy+ry],fill=f)
        def p(pts,f): d.polygon(pts,fill=f)
        def ln(pts,f,w): d.line(pts,fill=f,width=w)

        e(128,170,80,65,C); e(128,80,55,52,C)
        p([(80,42),(55,5),(102,38)],C); p([(176,42),(201,5),(154,38)],C)
        p([(83,40),(63,12),(100,38)],(80,40,50,180)); p([(173,40),(193,12),(156,38)],(80,40,50,180))
        e(108,76,16,14,G); e(148,76,16,14,G)
        e(108,76,9,11,(0,0,0,255)); e(148,76,9,11,(0,0,0,255))
        e(112,71,4,4,(255,255,255,200)); e(152,71,4,4,(255,255,255,200))
        e(128,100,8,6,(200,120,150,255))
        ln([(120,106),(128,112),(136,106)],(200,120,150,200),3)
        ln([(80,98),(122,102)],(200,200,200,100),2); ln([(80,108),(122,106)],(200,200,200,100),2)
        ln([(134,102),(176,98)],(200,200,200,100),2); ln([(134,106),(176,108)],(200,200,200,100),2)
        ln([(68,200),(50,180),(44,150),(52,120),(62,110)],C,14)
        e(95,228,22,14,C); e(161,228,22,14,C)

        img.save('cat_icon.ico', format='ICO', sizes=[(256,256),(64,64),(32,32),(16,16)])
        print('Icono generado OK')
        "

    - name: Build EXE
      run: pyinstaller --noconsole --onefile --icon=cat_icon.ico --name=GatoTaskbar gato_taskbar.py

    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: GatoTaskbar
        path: dist/GatoTaskbar.exe
